<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="js/localization/translations.js"></script>
  <script src="js/localization/i18n.js"></script>
  <title>StudentHub - Detail</title>
  <meta name="description"
        content="Details, terms and status for a StudentHub listing. Demo records are identified where applicable." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap"
        rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#203F7A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StudentHub" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/app-icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <script src="js/shared/pwa.js" defer></script>
</head>
<body>

  <div class="page-wrapper">
    <div class="app-shell">

      <!-- App bar with back arrow -->
      <header class="app-bar">
        <button class="app-bar__back" id="backBtn" type="button" aria-label="Go back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
          </svg>
        </button>
        <h1 class="app-bar__title" id="detailPageTitle">Loading…</h1>
      </header>

      <!-- Main content -->
      <main>
        <!-- Detail content injected by JS -->
        <div id="detailContainer" aria-live="polite" aria-label="Detail content"></div>
      </main>

    </div>
  </div>

  <script src="js/data/local-records.js"></script>
  <script src="js/data/benefits-catalog.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/shared/events.js"></script>
  <script src="js/shared/catalog-pages.js"></script>
  <script src="js/shared/navigation.js"></script>
</body>
</html>
