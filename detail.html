<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
