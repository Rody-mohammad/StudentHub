<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="js/localization/translations.js"></script>
  <script src="js/localization/i18n.js"></script>
  <title>StudentHub - السكن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-bar">
      <div class="app-bar__logo-wrap">
        <div class="app-bar__logo-icon"><img src="assets/images/StudentHubLogo.png" alt="Logo"></div>
        <span class="app-bar__title"><span style="color:var(--accent-amber);">Student</span>Hub</span>
      </div>
    </header>

    <main class="app-content">
      <section class="housing-directory" aria-labelledby="housingHeading">
        <div class="housing-directory__intro">
          <h1 class="section-heading" id="housingHeading">السكن الطلابي</h1>
          <p class="housing-directory__description">قارن بين خيارات السكن الجامعي والشقق الخاصة المتاحة للطلاب.</p>
        </div>
        <aside class="demo-banner" role="note">هذه بيانات تجريبية. الأسعار والعناوين والجهات المعروضة خيالية.</aside>

        <div class="housing-section-tabs" role="tablist" aria-label="نوع السكن">
          <button type="button" class="housing-section-tab active" id="universityHousingTab" role="tab" aria-selected="true" aria-controls="housingResults" data-housing-section="university"><span class="lucide-icon lucide-icon--building-2" aria-hidden="true"></span><span>السكن الجامعي</span></button>
          <button type="button" class="housing-section-tab" id="privateHousingTab" role="tab" aria-selected="false" aria-controls="housingResults" data-housing-section="private"><span class="lucide-icon lucide-icon--house" aria-hidden="true"></span><span>شقق خاصة للإيجار</span></button>
        </div>

        <div class="housing-directory__tools">
          <label class="housing-search-label" for="housingSearch">ابحث بالاسم أو المنطقة</label>
          <div class="housing-search-wrap"><span class="housing-search-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input class="housing-search" id="housingSearch" type="search" placeholder="اكتب اسم السكن أو المنطقة" autocomplete="off"></div>

          <div class="housing-directory__subcategories" id="universityCategories" aria-label="فئات السكن الجامعي"></div>

          <div class="housing-private-filters" id="privateFilters" hidden>
            <label><span>السعر الشهري</span><select id="housingPriceFilter"><option value="all">كل الأسعار</option><option value="under100">أقل من 100,000 د.ع</option><option value="100to200">100,000–200,000 د.ع</option><option value="over200">أكثر من 200,000 د.ع</option></select></label>
            <label><span>عدد غرف النوم</span><select id="housingRoomsFilter"><option value="all">كل الأعداد</option><option value="1">غرفة واحدة</option><option value="2">غرفتان</option><option value="3plus">3 غرف أو أكثر</option></select></label>
            <label><span>مفروش</span><select id="housingFurnishedFilter"><option value="all">الكل</option><option value="yes">مفروش</option><option value="no">غير مفروش</option></select></label>
          </div>

          <div class="housing-directory__sort-row">
            <label for="housingSort">ترتيب حسب</label>
            <select id="housingSort" class="housing-sort"><option value="default">افتراضي</option><option value="cheapest">الأقل سعراً</option><option value="closest">الأقرب للجامعة</option></select>
            <p id="housingCount" class="housing-count" aria-live="polite"></p>
          </div>
        </div>

        <div id="housingResults" role="tabpanel" aria-live="polite" aria-labelledby="universityHousingTab"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><span class="lucide-icon lucide-icon--house" aria-hidden="true"></span><span>الرئيسية</span></a>
      <a href="deals.html" class="nav-item"><span class="lucide-icon lucide-icon--badge-percent" aria-hidden="true"></span><span>العروض</span></a>
      <a href="benefits.html" class="nav-item"><span class="lucide-icon lucide-icon--graduation-cap" aria-hidden="true"></span><span>المزايا</span></a>
      <a href="transportation.html" class="nav-item"><span class="lucide-icon lucide-icon--bus" aria-hidden="true"></span><span>النقل</span></a>
      <a href="housing.html" class="nav-item active"><span class="lucide-icon lucide-icon--building-2" aria-hidden="true"></span><span>السكن</span></a>
    </nav>
  </div>
  <script src="js/data/local-records.js"></script>
  <script src="js/shared/catalog-pages.js"></script>
  <script src="js/shared/navigation.js"></script>
</body>
</html>
