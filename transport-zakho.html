<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="js/localization/translations.js"></script>
  <script src="js/localization/i18n.js"></script>
  <title>StudentHub - النقل داخل زاخو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-container">

    <header class="app-bar">
      <div class="app-bar__logo-wrap">
        <div class="app-bar__logo-icon">
          <img src="assets/images/StudentHubLogo.png" alt="Logo">
        </div>
        <span class="app-bar__title">
          <span style="color: var(--accent-amber);">Student</span>Hub
        </span>
      </div>
    </header>

    <main class="app-content">
      <section class="transport-directory" aria-labelledby="transportHeading">
        <h1 class="section-heading" id="transportHeading"></h1>
        <p class="transport-directory__description" id="transportIntro"></p>
        <aside class="demo-banner" id="transportDemoNotice" role="note"></aside>
        <div class="transport-directory__tools">
          <label class="transport-directory__search-label" id="transportSearchLabel" for="searchInput"></label>
          <div class="transport-directory__search-wrap"><input class="transport-directory__search" id="searchInput" type="search" autocomplete="off"></div>
          <div class="transport-directory__filters" id="filterChips" aria-label="تصفية حسب نوع النقل"></div>
          <p id="transportCount" class="transport-directory__count" aria-live="polite"></p>
        </div>
        <div id="cardContainer" aria-live="polite"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <span class="lucide-icon lucide-icon--house" aria-hidden="true"></span>
        <span>الرئيسية</span>
      </a>
      <a href="deals.html" class="nav-item">
        <span class="lucide-icon lucide-icon--badge-percent" aria-hidden="true"></span>
        <span>العروض</span>
      </a>
      <a href="benefits.html" class="nav-item">
        <span class="lucide-icon lucide-icon--graduation-cap" aria-hidden="true"></span>
        <span>المزايا</span>
      </a>
      <a href="transportation.html" class="nav-item active">
        <span class="lucide-icon lucide-icon--bus" aria-hidden="true"></span>
        <span>النقل</span>
      </a>
      <a href="housing.html" class="nav-item">
        <span class="lucide-icon lucide-icon--building-2" aria-hidden="true"></span>
        <span>السكن</span>
      </a>
    </nav>

  </div>

  <script src="js/data/local-records.js"></script>
  <script src="js/shared/catalog-pages.js"></script>
  <script src="js/shared/navigation.js"></script>
</body>
</html>
