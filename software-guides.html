<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="js/localization/translations.js"></script>
  <script src="js/localization/i18n.js"></script>
  <title>StudentHub - أدلة البرامج</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#203F7A" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/app-icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <script src="js/shared/pwa.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header class="app-bar"><div class="app-bar__logo-wrap"><div class="app-bar__logo-icon"><img src="assets/images/StudentHubLogo.png" alt="Logo"></div><span class="app-bar__title"><span style="color:var(--accent-amber)">Student</span>Hub</span></div></header>
    <main class="app-content benefit-page" data-benefit-page="software">
      <a class="benefit-back" href="benefits.html">العودة إلى المزايا</a>
      <div class="benefit-page-heading"><h1 class="section-heading" data-benefit-title></h1><p class="benefit-view-note" data-benefit-intro></p></div>
      <div class="benefit-controls">
        <label class="benefit-search-label" for="benefitSearch" data-benefit-search-label></label>
        <input class="benefit-search" id="benefitSearch" type="search" />
        <div class="benefit-filters" data-benefit-filters role="group"></div>
      </div>
      <div class="benefit-results" data-benefit-results aria-live="polite"></div>
      <noscript><p class="benefit-view-note">يلزم تفعيل JavaScript للبحث وتصفية البرامج.</p></noscript>
    </main>
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <a href="index.html" class="nav-item"><span class="lucide-icon lucide-icon--house" aria-hidden="true"></span><span>الرئيسية</span></a>
      <a href="deals.html" class="nav-item"><span class="lucide-icon lucide-icon--badge-percent" aria-hidden="true"></span><span>العروض</span></a>
      <a href="benefits.html" class="nav-item active"><span class="lucide-icon lucide-icon--graduation-cap" aria-hidden="true"></span><span>المزايا</span></a>
      <a href="transportation.html" class="nav-item"><span class="lucide-icon lucide-icon--bus" aria-hidden="true"></span><span>النقل</span></a>
      <a href="housing.html" class="nav-item"><span class="lucide-icon lucide-icon--building-2" aria-hidden="true"></span><span>السكن</span></a>
    </nav>
  </div>
  <script src="js/data/benefits-catalog.js"></script>
  <script src="js/pages/benefits/benefits.js"></script>
  <script src="js/shared/navigation.js"></script>
</body>
</html>
