<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="js/localization/translations.js"></script>
  <script src="js/localization/i18n.js"></script>
  <title>StudentHub - عروض المطاعم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#203F7A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StudentHub" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/app-icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <script src="js/shared/pwa.js" defer></script>
</head>
<body>

  <div class="app-container">

    <!-- Header -->
    <header class="app-bar">
      <div class="app-bar__logo-wrap">
        <div class="app-bar__logo-icon">
          <img src="assets/images/StudentHubLogo.png" alt="Logo">
        </div>
        <span class="app-bar__title">
          <span style="color: var(--accent-amber);">Student</span>Hub
        </span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content deals-directory">
      <section aria-labelledby="dealsHeading">
        <h1 class="section-heading" id="dealsHeading"></h1>
        <p class="deals-directory__intro" id="dealsIntro"></p>
        <label class="deals-directory__search-label" id="dealsSearchLabel" for="searchInput"></label>
        <input class="deals-directory__search" id="searchInput" type="search" autocomplete="off">
        <div class="deals-directory__filters" id="filterChips" aria-label="فئات عروض الطلاب"></div>
        <div id="cardContainer" aria-live="polite"></div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <span class="lucide-icon lucide-icon--house" aria-hidden="true"></span>
        <span>الرئيسية</span>
      </a>
      <a href="deals.html" class="nav-item active">
        <span class="lucide-icon lucide-icon--badge-percent" aria-hidden="true"></span>
        <span>العروض</span>
      </a>
      <a href="benefits.html" class="nav-item">
        <span class="lucide-icon lucide-icon--graduation-cap" aria-hidden="true"></span>
        <span>المزايا</span>
      </a>
      <a href="transportation.html" class="nav-item">
        <span class="lucide-icon lucide-icon--bus" aria-hidden="true"></span>
        <span>النقل</span>
      </a>
      <a href="housing.html" class="nav-item">
        <span class="lucide-icon lucide-icon--building-2" aria-hidden="true"></span>
        <span>السكن</span>
      </a>
    </nav>

  </div>

  <script src="js/data/local-records.js"></script>
  <script src="js/shared/catalog-pages.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" defer></script>
  <script src="js/shared/card-animations.js" defer></script>
  <script src="js/shared/navigation.js"></script>
</body>
</html>
